# Manual Helm deploy via shared workflow. Edit service_name / image_repo / namespace
# in `with:` if needed; only image_tag is chosen at run time.

name: Deploy with Helm

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag from CI (e.g. stage-abc1234)'
        required: true
        type: string
        default: 'stage-abc1234'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: nurixlabs/github-shared-workflows/.github/workflows/gsw-deploy-helm.yml@stable
    with:
      environment: hack # DO NOT CHANGE THIS VALUE
      region: in # DO NOT CHANGE THIS VALUE
      image_tag: ${{ github.event.inputs.image_tag }}
      service_name: hackathon-service # Change to your service name like agentx, voicex-worker
      image_repo: hackathon-service # Use the same value as service_name
      helm_chart_name: nurix-service # DO NOT CHANGE THIS VALUE
      namespace: hackathon-service #Use the same value as service_name
    secrets: inherit
